<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Snipe-IT Asset Lifecycle UI Tests</title>
  <desc id="desc">.NET 10 and Playwright end-to-end tests for the Snipe-IT asset lifecycle, run in Chromium, Firefox and WebKit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1730"/>
      <stop offset="0.55" stop-color="#10284f"/>
      <stop offset="1" stop-color="#0b3b43"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <circle cx="1130" cy="40" r="180" fill="#2563eb" fill-opacity="0.12"/>
  <circle cx="1200" cy="300" r="140" fill="#14b8a6" fill-opacity="0.12"/>

  <!-- mark -->
  <g transform="translate(72 86)">
    <rect width="128" height="128" rx="28" fill="url(#mark)"/>
    <rect x="28" y="32" width="72" height="46" rx="6" fill="none" stroke="#fff" stroke-width="7"/>
    <path d="M18 90h92l-6 10H24z" fill="#fff"/>
    <path d="M47 55l12 12 22-22" fill="none" stroke="#4ade80" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="236" y="138" fill="#ffffff" font-size="50" font-weight="700">Snipe-IT Asset Lifecycle UI Tests</text>
    <text x="238" y="180" fill="#bfdbfe" font-size="21">Create, check out, find and audit a Macbook Pro 13" on the live demo in Chromium, Firefox and WebKit.</text>

    <!-- flow chips -->
    <g font-size="17" font-weight="600" fill="#e2e8f0">
      <g transform="translate(238 214)">
        <rect width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#93c5fd" stroke-opacity="0.5"/>
        <text x="46" y="24" text-anchor="middle">Login</text>
      </g>
      <text x="342" y="238" fill="#64748b">&#8250;</text>
      <g transform="translate(360 214)">
        <rect width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#93c5fd" stroke-opacity="0.5"/>
        <text x="52" y="24" text-anchor="middle">Create</text>
      </g>
      <text x="476" y="238" fill="#64748b">&#8250;</text>
      <g transform="translate(494 214)">
        <rect width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#93c5fd" stroke-opacity="0.5"/>
        <text x="56" y="24" text-anchor="middle">Find in list</text>
      </g>
      <text x="618" y="238" fill="#64748b">&#8250;</text>
      <g transform="translate(636 214)">
        <rect width="132" height="36" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#93c5fd" stroke-opacity="0.5"/>
        <text x="66" y="24" text-anchor="middle">Verify details</text>
      </g>
      <text x="780" y="238" fill="#64748b">&#8250;</text>
      <g transform="translate(798 214)">
        <rect width="104" height="36" rx="18" fill="#22c55e" fill-opacity="0.18" stroke="#4ade80" stroke-opacity="0.7"/>
        <text x="52" y="24" text-anchor="middle" fill="#bbf7d0">History</text>
      </g>
    </g>

    <text x="238" y="286" fill="#94a3b8" font-size="16">.NET 10  ·  Playwright  ·  NUnit  ·  Allure  ·  axe-core  ·  GitHub Actions</text>
  </g>
</svg>
