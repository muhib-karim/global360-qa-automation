name: Bug report
description: The suite fails or behaves differently from the README
labels: [bug]
body:
  - type: input
    id: run
    attributes:
      label: CI run or command
      description: Link to the GitHub Actions run, or the exact local command
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [chromium, firefox, webkit, docker (chromium)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The failing step and assertion from the log. Attach the trace or screenshot from the diagnostics artifact if useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
