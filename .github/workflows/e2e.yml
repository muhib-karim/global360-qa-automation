name: E2E

on:
  pull_request:
  push:
    branches: [main, 'upgrade/**'] # release branches are verified before their PR
  schedule:
    - cron: '17 3 * * *' # nightly; the shared demo changes and resets, so drift is caught daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
      Diagnostics__OutputDir: ${{ github.workspace }}/artifacts
      Diagnostics__Trace: On
      Diagnostics__Video: On
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(jq -r '.dependencies["net10.0"]["Microsoft.Playwright"].resolved' tests/SnipeIt.UiTests/packages.lock.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+ ]] || { echo "::error::No Microsoft.Playwright version in packages.lock.json"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache the ${{ matrix.browser }} download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright.outputs.version }}
      - name: Install ${{ matrix.browser }} with OS dependencies (retries with backoff, alternate mirror)
        run: .github/scripts/install-browsers.sh "$BROWSER"
      - name: Run E2E (one CI-level retry on failure)
        id: test
        run: >-
          .github/scripts/retry-once.sh 'dotnet test --no-build --configuration Release
          --filter "TestCategory=E2E&TestCategory!=Quarantine" --blame-hang-timeout 8m
          --results-directory "TestResults/attempt-$ATTEMPT"
          --logger "trx;LogFileName=e2e-$BROWSER.trx"
          --logger "html;LogFileName=e2e-$BROWSER.html"
          --logger "console;verbosity=normal"'
      - name: Job summary
        if: always()
        shell: bash # pipefail, so the summary's exit code is not lost in the pipe to tee
        run: python3 .github/scripts/summarize.py "$BROWSER" "${{ steps.test.outputs.outcome }}" TestResults artifacts | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build README media from the passing run
        if: success() && matrix.browser == 'chromium'
        run: |
          command -v ffmpeg || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          mkdir -p media
          # Only the newest passing lifecycle run, never a failed first attempt that happens to be longer.
          run_dir=$(python3 -c 'import glob, json, os; r = sorted(p for p in glob.glob("artifacts/*Macbook_can_be_created*/run.json") if json.load(open(p)).get("outcome") == "Passed"); print(os.path.dirname(r[-1]) if r else "")')
          [ -n "$run_dir" ] || { echo "::error::No passing run.json found under artifacts/"; exit 1; }
          video=$(find "$run_dir" -name '*.webm' -printf '%s %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
          ffmpeg -loglevel error -y -i "$video" \
            -vf "setpts=0.5*PTS,fps=4,scale=640:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer" \
            -loop 0 media/demo.gif
          find "$run_dir" -name '*.jpg' -exec cp {} media/ \;
          ls -l media
          size=$(stat -c %s media/demo.gif)
          [ "$size" -lt 2000000 ] || echo "::warning::demo.gif is $size bytes (over 2 MB)"
      # Also after a pass on the CI-level retry: the failed first attempt is exactly the flake worth a look.
      - name: Collect the traces of failed tests
        if: always()
        run: |
          mkdir -p failure-traces
          for run in artifacts/*/run.json; do
            [ "$(jq -r .outcome "$run")" = Failed ] || continue
            dir=$(dirname "$run")
            [ -f "$dir/trace.zip" ] && cp "$dir/trace.zip" "failure-traces/$(basename "$dir").zip"
          done
          ls -l failure-traces
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: failure-traces-${{ matrix.browser }}
          path: failure-traces/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.browser }}
          path: TestResults/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: allure-results-${{ matrix.browser }}
          path: tests/SnipeIt.UiTests/bin/Release/net10.0/allure-results/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-${{ matrix.browser }}
          path: artifacts/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.browser == 'chromium'
        with:
          name: readme-media
          path: media/
          retention-days: 14

  quarantine:
    # Quarantined tests run here, outside the gate, until they are fixed or their [Quarantine] expires (see
    # CONTRIBUTING.md). With nothing quarantined the job ends after the checkout.
    name: quarantine (chromium, non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      BROWSER: chromium
      Diagnostics__OutputDir: ${{ github.workspace }}/artifacts
      Diagnostics__Trace: On
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find quarantined tests
        id: find
        run: |
          count=$(git grep -hE '^\s*\[Quarantine\(' -- tests/ | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Quarantined tests: $count" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.find.outputs.count != '0'
        with:
          global-json-file: global.json
      - name: Build, install chromium and run the quarantined tests
        if: steps.find.outputs.count != '0'
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore --configuration Release
          .github/scripts/install-browsers.sh chromium
          dotnet test --no-build --configuration Release --filter "TestCategory=E2E&TestCategory=Quarantine" \
            --results-directory TestResults --logger "trx;LogFileName=quarantine.trx" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.find.outputs.count != '0'
        with:
          name: quarantine-results
          path: |
            TestResults/
            artifacts/
          retention-days: 14

  report:
    name: Allure report
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: allure-results-*
          path: allure-results
      - name: Install Allure CLI 2.46.1 (checksum verified)
        run: |
          java -version
          curl -sSLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.46.1/allure-2.46.1.tgz
          echo "37428164f310c8d137cfdd2c3a25d049b233261ddab13e1bd4dfd7627b5cbf8d  allure.tgz" | sha256sum -c
          tar -xzf allure.tgz
      - name: Generate the merged report
        run: |
          ls allure-results/*/*-result.json > /dev/null || { echo "::error::No Allure results were produced"; exit 1; }
          first=$(ls -d allure-results/*/ | head -1)
          cat > "$first/environment.properties" <<PROPS
          Target=https://demo.snipeitapp.com
          Browsers=chromium, firefox, webkit
          Runner=GitHub Actions ubuntu-24.04
          Commit=${{ github.sha }}
          PROPS
          cat > "$first/executor.json" <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "${{ github.workflow }} #${{ github.run_number }}",
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
          allure-2.46.1/bin/allure generate allure-results/* --clean -o allure-report
      - name: Report summary
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("allure-report/widgets/summary.json"))["statistic"]
          print("## Allure report (all browsers)\n")
          print("| Total | Passed | Failed | Broken | Skipped |\n| --- | --- | --- | --- | --- |")
          print(f"| {s['total']} | {s['passed']} | {s['failed']} | {s['broken']} | {s['skipped']} |")
          print("\nDownload the `allure-report` artifact and open `index.html` through a local web server.")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: test-results
      - name: Build the Pages site (landing page, Allure, per-browser HTML reports, pass counts)
        run: python3 src/.github/scripts/build-site.py src/docs allure-report test-results _site
      - name: Screenshot the site and the reports (README showcase)
        run: |
          (cd _site && exec python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1) &
          for _ in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8000/ && break; sleep 0.5; done
          mkdir -p screenshots
          shot() { google-chrome --headless=new --no-sandbox --hide-scrollbars --window-size="$3" \
            --virtual-time-budget=8000 --screenshot="screenshots/$1.png" "http://127.0.0.1:8000/$2"; }
          shot landing "" 1280,1100
          shot allure "report/index.html" 1440,900
          shot report-chromium "runs/chromium.html" 1280,900 || true
          ls -l screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-screenshots
          path: screenshots/
          retention-days: 14
      # Built on every run, so a branch proves the exact site that main publishes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-site
          path: _site/
          retention-days: 30

  pages:
    name: Publish GitHub Pages
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-site
          path: _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
