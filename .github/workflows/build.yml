name: Build and format

on:
  pull_request:
  push:
    branches: [main, 'upgrade/**'] # release branches are verified before their PR
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build-and-format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet format --verify-no-changes --no-restore
      - name: Unit tests (no browser, no network)
        run: dotnet test --no-build --configuration Release --filter TestCategory=Unit --logger "console;verbosity=normal"
      - name: Guardrails
        run: |
          status=0
          if git grep -n -e "$(printf '\xe2\x80\x93')" -e "$(printf '\xe2\x80\x94')"; then
            echo "::error::En or em dash found (use commas, colons, parentheses or hyphens)"; status=1
          fi
          if git grep -nE 'Thread\.Sleep|Task\.Delay|WaitForTimeoutAsync|Force = true' -- tests/; then
            echo "::error::Fixed sleeps or forced clicks are not allowed"; status=1
          fi
          if git ls-files | grep -E '(^|/)(bin|obj|TestResults|artifacts|allure-results|allure-report)/|\.(trx|webm)$|trace\.zip$'; then
            echo "::error::Build output or test artifacts are committed"; status=1
          fi
          exit $status
      - name: Self-test the CI-level retry script
        env:
          PREFLIGHT: 'true'
        run: |
          GITHUB_OUTPUT=retry1 .github/scripts/retry-once.sh 'test "$ATTEMPT" = 2'
          grep -qx 'outcome=passed-on-retry' retry1
          if GITHUB_OUTPUT=retry2 .github/scripts/retry-once.sh 'false'; then exit 1; fi
          grep -qx 'outcome=failed' retry2
          GITHUB_OUTPUT=retry3 .github/scripts/retry-once.sh 'true'
          grep -qx 'outcome=passed' retry3
      - name: Self-test the browser install script
        env:
          BACKOFF_SECONDS: '0'
        run: |
          # The fake installer fails unless a mirror is pinned, as when the default download host is down.
          printf '#!/bin/sh\necho "fake $*"; [ -n "${PLAYWRIGHT_DOWNLOAD_HOST:-}" ]\n' > "$RUNNER_TEMP/fake-playwright"
          chmod +x "$RUNNER_TEMP/fake-playwright"
          INSTALLER="$RUNNER_TEMP/fake-playwright" .github/scripts/install-browsers.sh chromium | tee install1
          grep -qx 'fake install --with-deps chromium' install1
          grep -qx 'Installed chromium on attempt 2' install1
          if INSTALLER=false INSTALL_ATTEMPTS=3 .github/scripts/install-browsers.sh webkit; then exit 1; fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -sSLo gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c
          tar -xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t snipeit-uitests .
      - name: Run the E2E test in the container (one CI-level retry on failure)
        id: test
        run: >-
          .github/scripts/retry-once.sh 'docker run --init --ipc=host --name "e2e-$ATTEMPT" snipeit-uitests; rc=$?;
          mkdir -p "docker-results/TestResults/attempt-$ATTEMPT" "docker-results/artifacts/attempt-$ATTEMPT";
          docker cp "e2e-$ATTEMPT:/src/TestResults/." "docker-results/TestResults/attempt-$ATTEMPT/";
          docker cp "e2e-$ATTEMPT:/src/artifacts/." "docker-results/artifacts/attempt-$ATTEMPT/";
          exit $rc'
      - name: Job summary
        if: always()
        shell: bash # pipefail, so the summary's exit code is not lost in the pipe to tee
        run: python3 .github/scripts/summarize.py chromium "${{ steps.test.outputs.outcome }}" docker-results/TestResults docker-results/artifacts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: docker-results
          path: docker-results/
          retention-days: 14
